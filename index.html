<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Exposure Notes — Photography</title>

  <meta
    name="description"
    content="Exposure Notes — moments, places and perspectives through mobile photography."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: #080808;
    }

    body {
      background: #080808;
      color: #f2f0eb;
      font-family: "Manrope", sans-serif;
      overflow-x: hidden;
      cursor: none;
    }

    ::selection {
      background: #f2f0eb;
      color: #080808;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }


    /* =========================================================
       CURSOR
    ========================================================= */

    .cursor {
      position: fixed;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;

      transition:
        width .3s ease,
        height .3s ease,
        background .3s ease;
    }

    .cursor-ring {
      position: fixed;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);

      transition:
        width .35s cubic-bezier(.2,.8,.2,1),
        height .35s cubic-bezier(.2,.8,.2,1),
        border-color .3s ease;
    }

    body.cursor-hover .cursor {
      width: 15px;
      height: 15px;
    }

    body.cursor-hover .cursor-ring {
      width: 65px;
      height: 65px;
      border-color: rgba(255,255,255,.8);
    }


    /* =========================================================
       GRAIN
    ========================================================= */

    .grain {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      z-index: 9997;
      pointer-events: none;
      opacity: .045;

      background-image:
        radial-gradient(
          rgba(255,255,255,.15) 1px,
          transparent 1px
        );

      background-size: 4px 4px;
      animation: grain .2s steps(2) infinite;
    }

    @keyframes grain {
      0% { transform: translate(0,0); }
      25% { transform: translate(2%,-1%); }
      50% { transform: translate(-1%,2%); }
      75% { transform: translate(1%,1%); }
      100% { transform: translate(-2%,-2%); }
    }


    /* =========================================================
       LOADER
    ========================================================= */

    .loader {
      position: fixed;
      inset: 0;
      background: #080808;
      z-index: 10000;

      display: flex;
      align-items: center;
      justify-content: center;

      animation:
        loaderExit .9s cubic-bezier(.77,0,.18,1) 2.8s forwards;
    }

    @keyframes loaderExit {
      0% {
        opacity: 1;
        visibility: visible;
      }

      100% {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }

    .loader-inner {
      width: min(80%, 500px);
    }

    .loader-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;

      font-family: "DM Mono", monospace;
      font-size: 10px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #777;
    }

    .loader-name {
      font-size: clamp(35px, 7vw, 90px);
      font-weight: 800;
      letter-spacing: -.06em;
      line-height: .85;
      overflow: hidden;
    }

    .loader-name span {
      display: inline-block;
      transform: translateY(110%);

      animation:
        loaderText 1.1s cubic-bezier(.77,0,.18,1) .2s forwards;
    }

    @keyframes loaderText {
      to {
        transform: translateY(0);
      }
    }

    .loader-line {
      margin-top: 35px;
      width: 100%;
      height: 1px;
      background: #222;
      overflow: hidden;
    }

    .loader-line span {
      display: block;
      width: 0;
      height: 100%;
      background: #fff;

      animation:
        loaderLine 2.1s cubic-bezier(.77,0,.18,1) forwards;
    }

    @keyframes loaderLine {
      to {
        width: 100%;
      }
    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px 4vw;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: space-between;

      mix-blend-mode: difference;
    }

    .logo {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: -.02em;
    }

    .logo span {
      font-weight: 300;
      opacity: .65;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 35px;
    }

    .nav-link {
      font-family: "DM Mono", monospace;
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: .14em;
      position: relative;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0;
      height: 1px;
      background: #fff;
      transition: width .4s ease;
    }

    .nav-link:hover::after {
      width: 100%;
    }

    .menu-button {
      width: 35px;
      height: 35px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 50%;

      display: grid;
      place-items: center;

      cursor: none;
      background: transparent;
      color: white;
    }

    .menu-lines {
      width: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .menu-lines span {
      height: 1px;
      width: 100%;
      background: white;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      height: 100svh;
      min-height: 700px;
      position: relative;
      overflow: hidden;

      display: flex;
      align-items: flex-end;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      transform: scale(1.08);

      animation:
        heroZoom 2.5s cubic-bezier(.2,.7,.2,1) forwards;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-image::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.15),
          rgba(0,0,0,.05) 35%,
          rgba(0,0,0,.8)
        );
    }

    @keyframes heroZoom {
      to {
        transform: scale(1);
      }
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 0 4vw 7vh;
    }

    .hero-small {
      font-family: "DM Mono", monospace;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: .18em;
      margin-bottom: 20px;
      opacity: .7;
      overflow: hidden;
    }

    .hero-small span {
      display: block;
      transform: translateY(100%);

      animation:
        revealUp 1.1s cubic-bezier(.77,0,.18,1) 1.8s forwards;
    }

    .hero-title {
      font-size: clamp(75px, 16vw, 240px);
      line-height: .76;
      letter-spacing: -.085em;
      font-weight: 800;
      overflow: hidden;
    }

    .hero-title span {
      display: block;
      transform: translateY(110%);

      animation:
        revealUp 1.4s cubic-bezier(.77,0,.18,1) 1.5s forwards;
    }

    .hero-title span:nth-child(2) {
      animation-delay: 1.65s;
    }

    @keyframes revealUp {
      to {
        transform: translateY(0);
      }
    }

    .hero-bottom {
      margin-top: 55px;

      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      font-family: "DM Mono", monospace;
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .7;
    }

    .scroll-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .scroll-line {
      width: 55px;
      height: 1px;
      background: rgba(255,255,255,.45);
      position: relative;
      overflow: hidden;
    }

    .scroll-line::after {
      content: "";
      position: absolute;
      left: -100%;
      top: 0;
      width: 100%;
      height: 100%;
      background: #fff;

      animation:
        scrollLine 2s ease-in-out infinite;
    }

    @keyframes scrollLine {
      0% { left: -100%; }
      50%, 100% { left: 100%; }
    }


    /* =========================================================
       INTRO
    ========================================================= */

    .intro {
      min-height: 85vh;
      padding: 16vh 8vw;

      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 8vw;
      align-items: center;

      background: #080808;
    }

    .section-number {
      font-family: "DM Mono", monospace;
      font-size: 10px;
      color: #777;
      letter-spacing: .15em;
    }

    .intro-text {
      font-size: clamp(34px, 5vw, 75px);
      line-height: 1.02;
      letter-spacing: -.05em;
      max-width: 1000px;
      font-weight: 400;
    }

    .intro-text em {
      font-family: "Playfair Display", serif;
      font-weight: 400;
    }

    .intro-description {
      margin-top: 50px;
      max-width: 470px;
      color: #8b8b8b;
      font-size: 14px;
      line-height: 1.8;
    }


    /* =========================================================
       CURATED PHOTOGRAPHY
    ========================================================= */

    .collections {
      padding: 8vh 4vw 20vh;
    }

    .collections-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      padding-bottom: 55px;
      margin-bottom: 80px;

      border-bottom: 1px solid #202020;
    }

    .collections-title {
      font-size: clamp(50px, 9vw, 130px);
      letter-spacing: -.07em;
      line-height: .8;
      font-weight: 700;
    }

    .collections-meta {
      font-family: "DM Mono", monospace;
      font-size: 9px;
      color: #777;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-align: right;
    }

    .photo-collection {
      margin-bottom: 18vh;
    }

    .photo-collection:last-child {
      margin-bottom: 0;
    }

    .collection-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 28px;
    }

    .collection-heading h3 {
      font-size: clamp(32px, 5vw, 72px);
      line-height: .9;
      letter-spacing: -.06em;
      font-weight: 600;
    }

    .collection-heading span {
      font-family: "DM Mono", monospace;
      font-size: 8px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .14em;
    }


    /* =========================================================
       NATURAL PHOTO DISPLAY
       No fixed-height box.
       Image controls its own height.
    ========================================================= */

    .collection-media {
      position: relative;
      width: 100%;
      background: transparent;
      overflow: hidden;
    }

    .collection-media.single {
      min-height: 0;
    }

    .collection-media.single img {
      display: block;
      width: 100%;
      height: auto;
      max-height: none;
      object-fit: contain;
      object-position: center;
    }


    /* =========================================================
       NATURAL-RATIO SLIDESHOW
    ========================================================= */

    .photo-slideshow {
      position: relative;
      width: 100%;

      /*
        JavaScript changes this ratio to match
        the currently visible image.
      */
      aspect-ratio: var(--slide-ratio, 16 / 9);

      background: transparent;
      overflow: hidden;

      transition: height .3s ease;
    }

    .photo-slide {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 1s ease,
        visibility 1s ease;
    }

    .photo-slide.active {
      opacity: 1;
      visibility: visible;
    }

    .photo-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    .collection-caption {
      display: flex;
      justify-content: space-between;
      gap: 20px;

      margin-top: 16px;

      font-family: "DM Mono", monospace;
      font-size: 8px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .collection-caption span:last-child {
      text-align: right;
    }


    /* =========================================================
       CERTIFICATES
    ========================================================= */

    .work {
      padding: 10vh 4vw 20vh;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      padding-bottom: 55px;
      border-bottom: 1px solid #202020;
      margin-bottom: 70px;
    }

    .section-title {
      font-size: clamp(50px, 9vw, 130px);
      letter-spacing: -.07em;
      line-height: .8;
      font-weight: 700;
    }

    .section-meta {
      font-family: "DM Mono", monospace;
      font-size: 9px;
      color: #777;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-align: right;
    }


    /* =========================================================
       CERTIFICATE GRID
    ========================================================= */

    .certificate-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 70px 30px;
    }

    .certificate-item {
      position: relative;
    }

    .certificate-image-wrap {
      position: relative;
      width: 100%;
      background: #111;
      overflow: hidden;
    }

    .certificate-image {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;

      transition:
        transform 1s cubic-bezier(.2,.7,.2,1),
        filter .8s ease;
    }

    .certificate-item:hover .certificate-image {
      transform: scale(1.025);
      filter: brightness(1.06);
    }

    .certificate-overlay {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          transparent 45%,
          rgba(0,0,0,.65)
        );

      opacity: 0;
      transition: opacity .5s ease;
      pointer-events: none;
    }

    .certificate-item:hover .certificate-overlay {
      opacity: 1;
    }

    .certificate-number {
      margin-top: 18px;

      font-family: "DM Mono", monospace;
      font-size: 8px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .14em;
    }

    .certificate-title {
      margin-top: 9px;

      font-size: clamp(16px, 1.5vw, 22px);
      line-height: 1.3;
      letter-spacing: -.025em;
      font-weight: 500;
      color: #ddd;
    }


    /* =========================================================
       CINEMATIC FEATURE
    ========================================================= */

    .cinematic {
      height: 100svh;
      min-height: 650px;
      position: relative;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cinematic-image {
      position: absolute;
      inset: -10%;
      width: 120%;
      height: 120%;
    }

    .cinematic-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cinematic::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.35);
    }

    .cinematic-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 900px;
      padding: 30px;
    }

    .cinematic-label {
      font-family: "DM Mono", monospace;
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: .2em;
      color: #ddd;
      margin-bottom: 35px;
    }

    .cinematic-title {
      font-size: clamp(50px, 9vw, 140px);
      line-height: .85;
      letter-spacing: -.075em;
    }

    .cinematic-title em {
      font-family: "Playfair Display", serif;
      font-weight: 400;
    }


    /* =========================================================
       MARQUEE
    ========================================================= */

    .marquee {
      overflow: hidden;
      padding: 45px 0;

      border-top: 1px solid #202020;
      border-bottom: 1px solid #202020;

      white-space: nowrap;
    }

    .marquee-track {
      display: inline-flex;

      animation:
        marquee 22s linear infinite;
    }

    .marquee span {
      font-size: clamp(55px, 8vw, 120px);
      font-weight: 700;
      letter-spacing: -.07em;
      margin-right: 70px;
    }

    .marquee span:nth-child(even) {
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-weight: 400;
    }

    @keyframes marquee {
      to {
        transform: translateX(-50%);
      }
    }


    /* =========================================================
       ABOUT
    ========================================================= */

    .about {
      padding: 18vh 8vw;

      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 10vw;
      align-items: start;
    }

    .about-heading {
      font-family: "DM Mono", monospace;
      font-size: 10px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #777;
    }

    .about-copy {
      font-size: clamp(30px, 4.5vw, 65px);
      line-height: 1.05;
      letter-spacing: -.05em;
    }

    .about-copy em {
      font-family: "Playfair Display", serif;
    }

    .about-details {
      margin-top: 70px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;

      border-top: 1px solid #222;
      padding-top: 20px;
    }

    .detail span {
      display: block;

      font-family: "DM Mono", monospace;
      font-size: 8px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .13em;
      margin-bottom: 10px;
    }

    .detail strong {
      font-size: 12px;
      font-weight: 500;
    }


    /* =========================================================
       INSTAGRAM
    ========================================================= */

    .instagram {
      min-height: 75vh;
      padding: 15vh 4vw;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      border-top: 1px solid #202020;
    }

    .instagram-inner {
      max-width: 1000px;
    }

    .instagram-small {
      font-family: "DM Mono", monospace;
      font-size: 9px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: .15em;
      margin-bottom: 30px;
    }

    .instagram-title {
      font-size: clamp(60px, 12vw, 180px);
      font-weight: 700;
      line-height: .78;
      letter-spacing: -.085em;
    }

    .instagram-handle {
      margin-top: 50px;

      display: inline-flex;
      align
