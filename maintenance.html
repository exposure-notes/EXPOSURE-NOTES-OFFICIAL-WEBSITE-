<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Exposure Notes — Under Maintenance</title>

<meta
  name="description"
  content="Exposure Notes — Photography portfolio currently under maintenance."
>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Manrope:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
  rel="stylesheet"
>


<style>

/* =========================================================
   RESET
========================================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  min-height: 100vh;

  overflow: hidden;

  background: #090908;
  color: #eeeae2;

  font-family: "Manrope", sans-serif;
}

::selection {
  background: #eeeae2;
  color: #090908;
}


/* =========================================================
   VARIABLES
========================================================= */

:root {

  --bg: #090908;

  --text: #eeeae2;
  --muted: #8b8881;
  --dim: #4f4d48;

  --accent: #d8c9a8;

  --line: rgba(238,234,226,.13);

}


/* =========================================================
   MAIN
========================================================= */

.maintenance {

  position: relative;

  min-height: 100vh;

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  isolation: isolate;

}


/* =========================================================
   BACKGROUND
========================================================= */

.background {

  position: absolute;

  inset: 0;

  z-index: -10;

  background:

    radial-gradient(
      circle at 75% 35%,
      rgba(216,201,168,.10),
      transparent 28%
    ),

    radial-gradient(
      circle at 20% 80%,
      rgba(255,255,255,.035),
      transparent 30%
    ),

    linear-gradient(
      135deg,
      #080807,
      #11110f 45%,
      #080807
    );

}


/* Moving light */

.light-sweep {

  position: absolute;

  top: -30%;
  left: -20%;

  width: 45%;
  height: 170%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(216,201,168,.055),
      transparent
    );

  transform: rotate(18deg);

  filter: blur(25px);

  animation:
    lightSweep 9s ease-in-out infinite;

}

@keyframes lightSweep {

  0% {
    transform:
      translateX(-100%)
      rotate(18deg);
  }

  50% {
    transform:
      translateX(230%)
      rotate(18deg);
  }

  100% {
    transform:
      translateX(-100%)
      rotate(18deg);
  }

}


/* =========================================================
   AMBIENT ORBS
========================================================= */

.orb {

  position: absolute;

  border-radius: 50%;

  pointer-events: none;

  filter: blur(2px);

  opacity: .35;

}

.orb-1 {

  width: 180px;
  height: 180px;

  top: 8%;
  left: 8%;

  border: 1px solid rgba(216,201,168,.12);

  box-shadow:
    inset 0 0 50px rgba(216,201,168,.04),
    0 0 60px rgba(216,201,168,.035);

  animation:
    orbFloat1 8s ease-in-out infinite;

}

.orb-2 {

  width: 90px;
  height: 90px;

  right: 12%;
  bottom: 12%;

  background:
    radial-gradient(
      circle,
      rgba(216,201,168,.14),
      transparent 70%
    );

  animation:
    orbFloat2 6s ease-in-out infinite;

}

@keyframes orbFloat1 {

  0%,
  100% {
    transform:
      translate(0,0)
      scale(1);
  }

  50% {
    transform:
      translate(30px,-25px)
      scale(1.08);
  }

}

@keyframes orbFloat2 {

  0%,
  100% {
    transform:
      translate(0,0);
  }

  50% {
    transform:
      translate(-25px,20px);
  }

}


/* =========================================================
   CAMERA / LENS VISUAL
========================================================= */

.camera-system {

  position: absolute;

  right: -8%;
  top: 50%;

  width: min(48vw, 620px);
  aspect-ratio: 1;

  transform:
    translateY(-50%)
    rotate(-18deg);

  opacity: .58;

  pointer-events: none;

  animation:
    cameraFloat 8s ease-in-out infinite;

}

@keyframes cameraFloat {

  0%,
  100% {
    transform:
      translateY(-50%)
      rotate(-18deg);
  }

  50% {
    transform:
      translateY(calc(-50% - 18px))
      rotate(-16deg);
  }

}


/* Phone body */

.phone-body {

  position: absolute;

  inset: 12% 4%;

  border-radius: 70px;

  background:

    linear-gradient(
      135deg,
      #252522,
      #11110f 55%,
      #292925
    );

  border: 1px solid rgba(238,234,226,.16);

  box-shadow:

    inset 0 0 40px rgba(255,255,255,.025),

    0 35px 100px rgba(0,0,0,.65);

}


/* Camera island */

.camera-island {

  position: absolute;

  width: 55%;

  aspect-ratio: 1;

  top: 15%;
  left: 10%;

  border-radius: 38px;

  background:
    linear-gradient(
      145deg,
      #252522,
      #0c0c0b
    );

  border: 1px solid rgba(238,234,226,.13);

  box-shadow:
    0 20px 50px rgba(0,0,0,.45);

}


/* Lens */

.lens {

  position: absolute;

  width: 30%;

  aspect-ratio: 1;

  border-radius: 50%;

  background:

    radial-gradient(
      circle at 40% 35%,
      rgba(255,255,255,.28),
      transparent 8%
    ),

    radial-gradient(
      circle,
      #0b0b0b 0%,
      #151513 35%,
      #050505 60%,
      #252522 63%,
      #080808 72%,
      #22221f 78%,
      #090908 85%
    );

  border: 2px solid #383832;

  box-shadow:

    inset 0 0 15px rgba(255,255,255,.06),

    0 0 0 6px #151513,

    0 0 0 8px #30302b,

    0 0 0 10px #0a0a09,

    0 12px 30px rgba(0,0,0,.55);

  overflow: hidden;

}


/* Lens reflection */

.lens::before {

  content: "";

  position: absolute;

  width: 45%;
  height: 45%;

  top: 10%;
  left: 13%;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(216,201,168,.28),
      transparent 65%
    );

  filter: blur(2px);

  animation:
    lensReflection 4s ease-in-out infinite;

}

@keyframes lensReflection {

  0%,
  100% {
    opacity: .35;
    transform: translate(0,0);
  }

  50% {
    opacity: .8;
    transform: translate(12px,8px);
  }

}


/* Lens rings */

.lens::after {

  content: "";

  position: absolute;

  inset: 17%;

  border-radius: 50%;

  border: 1px solid rgba(216,201,168,.25);

  animation:
    lensRing 5s linear infinite;

}

@keyframes lensRing {

  from {
    transform: rotate(0deg) scale(.96);
  }

  50% {
    transform: rotate(180deg) scale(1.02);
  }

  to {
    transform: rotate(360deg) scale(.96);
  }

}


/* Lens positions */

.lens-1 {
  top: 12%;
  left: 10%;
}

.lens-2 {
  top: 12%;
  right: 10%;
}

.lens-3 {
  bottom: 10%;
  left: 35%;
}


/* =========================================================
   MAIN CONTENT
========================================================= */

.content {

  position: relative;

  z-index: 10;

  width: min(900px, 90vw);

  text-align: center;

  display: flex;

  flex-direction: column;

  align-items: center;

}


/* =========================================================
   BRAND
========================================================= */

.brand {

  font-family: "DM Mono", monospace;

  font-size: 10px;

  letter-spacing: .42em;

  text-transform: uppercase;

  color: var(--text);

  margin-bottom: 45px;

  opacity: 0;

  animation:
    fadeUp .9s .3s forwards;

}

.brand span {

  color: var(--accent);

}


/* =========================================================
   CAMERA ICON
========================================================= */

.camera-icon {

  position: relative;

  width: 42px;
  height: 30px;

  margin-bottom: 22px;

  border: 1px solid var(--accent);

  border-radius: 7px;

  opacity: 0;

  animation:
    cameraAppear .8s .1s forwards;

}

.camera-icon::before {

  content: "";

  position: absolute;

  width: 12px;
  height: 5px;

  left: 8px;
  top: -6px;

  border: 1px solid var(--accent);

  border-bottom: 0;

  border-radius: 4px 4px 0 0;

}

.camera-icon::after {

  content: "";

  position: absolute;

  width: 11px;
  height: 11px;

  left: 50%;
  top: 50%;

  transform: translate(-50%,-50%);

  border: 1px solid var(--accent);

  border-radius: 50%;

  box-shadow:
    0 0 15px rgba(216,201,168,.35);

  animation:
    iconLens 3s ease-in-out infinite;

}

@keyframes cameraAppear {

  from {
    opacity: 0;
    transform: scale(.6) rotate(-20deg);
  }

  to {
    opacity: 1;
    transform: scale(1) rotate(0);
  }

}

@keyframes iconLens {

  0%,
  100% {
    transform:
      translate(-50%,-50%)
      scale(1);
  }

  50% {
    transform:
      translate(-50%,-50%)
      scale(1.22);
  }

}


/* =========================================================
   EYEBROW
========================================================= */

.eyebrow {

  font-family: "DM Mono", monospace;

  font-size: 9px;

  letter-spacing: .35em;

  text-transform: uppercase;

  color: var(--muted);

  margin-bottom: 22px;

  opacity: 0;

  animation:
    fadeUp .9s .55s forwards;

}


/* =========================================================
   TITLE
========================================================= */

.title {

  font-size:
    clamp(58px, 9vw, 125px);

  line-height: .82;

  letter-spacing: -.075em;

  font-weight: 500;

  opacity: 0;

  animation:
    titleReveal 1.2s .7s forwards;

}

.title em {

  font-family:
    "Playfair Display",
    serif;

  font-style: italic;

  font-weight: 400;

}


@keyframes titleReveal {

  from {

    opacity: 0;

    transform:
      translateY(45px)
      scale(.96);

    filter: blur(10px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0)
      scale(1);

    filter: blur(0);

  }

}


/* =========================================================
   DESCRIPTION
========================================================= */

.description {

  max-width: 520px;

  margin-top: 35px;

  color: #9a9790;

  font-size: 13px;

  line-height: 1.9;

  opacity: 0;

  animation:
    fadeUp .9s 1s forwards;

}


/* =========================================================
   STATUS
========================================================= */

.status {

  display: flex;

  align-items: center;

  gap: 12px;

  margin-top: 40px;

  font-family: "DM Mono", monospace;

  font-size: 8px;

  letter-spacing: .2em;

  text-transform: uppercase;

  color: var(--muted);

  opacity: 0;

  animation:
    fadeUp .9s 1.2s forwards;

}


.status-dot {

  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: var(--accent);

  box-shadow:
    0 0 0 0 rgba(216,201,168,.5);

  animation:
    pulse 2s infinite;

}

@keyframes pulse {

  0% {
    box-shadow:
      0 0 0 0 rgba(216,201,168,.5);
  }

  70% {
    box-shadow:
      0 0 0 10px rgba(216,201,168,0);
  }

  100% {
    box-shadow:
      0 0 0 0 rgba(216,201,168,0);
  }

}


/* =========================================================
   PHOTO MOTION LINE
========================================================= */

.motion-line {

  position: relative;

  width: 280px;

  height: 1px;

  margin-top: 38px;

  background: var(--line);

  overflow: hidden;

  opacity: 0;

  animation:
    fadeUp .8s 1.35s forwards;

}

.motion-line::after {

  content: "";

  position: absolute;

  top: 0;
  left: -30%;

  width: 30%;
  height: 1px;

  background:

    linear-gradient(
      90deg,
      transparent,
      var(--accent),
      transparent
    );

  box-shadow:
    0 0 10px rgba(216,201,168,.7);

  animation:
    lineTravel 2.5s linear infinite;

}

@keyframes lineTravel {

  from {
    left: -30%;
  }

  to {
    left: 110%;
  }

}


/* =========================================================
   FOOTER
========================================================= */

.footer {

  position: absolute;

  left: 0;
  bottom: 28px;

  width: 100%;

  padding: 0 30px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  font-family: "DM Mono", monospace;

  font-size: 8px;

  letter-spacing: .15em;

  text-transform: uppercase;

  color: var(--dim);

  z-index: 20;

}

.footer strong {

  color: #8f8b83;

  font-weight: 400;

}


/* =========================================================
   CORNER MARKS
========================================================= */

.corner {

  position: absolute;

  width: 35px;
  height: 35px;

  opacity: .45;

}

.corner::before,
.corner::after {

  content: "";

  position: absolute;

  background: var(--accent);

}

.corner::before {

  width: 100%;
  height: 1px;

}

.corner::after {

  width: 1px;
  height: 100%;

}

.corner-tl {
  top: 28px;
  left: 30px;
}

.corner-tr {
  top: 28px;
  right: 30px;
  transform: rotate(90deg);
}

.corner-bl {
  bottom: 28px;
  left: 30px;
  transform: rotate(-90deg);
}

.corner-br {
  bottom: 28px;
  right: 30px;
  transform: rotate(180deg);
}


/* =========================================================
   GENERAL ANIMATION
========================================================= */

@keyframes fadeUp {

  from {

    opacity: 0;

    transform:
      translateY(25px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

  body {
    overflow: hidden;
  }

  .camera-system {

    width: 105vw;

    right: -42%;

    top: 15%;

    opacity: .28;

  }

  .content {

    width: 88vw;

  }

  .brand {

    font-size: 8px;

    letter-spacing: .28em;

    margin-bottom: 35px;

  }

  .camera-icon {

    width: 38px;
    height: 27px;

  }

  .eyebrow {

    font-size: 8px;

    letter-spacing: .24em;

  }

  .title {

    font-size:
      clamp(55px, 16vw, 90px);

    line-height: .85;

  }

  .description {

    font-size: 12px;

    max-width: 340px;

    margin-top: 28px;

  }

  .status {

    margin-top: 30px;

  }

  .motion-line {

    width: 190px;

    margin-top: 30px;

  }

  .footer {

    bottom: 18px;

    padding: 0 20px;

    font-size: 7px;

    letter-spacing: .1em;

  }

  .footer span:first-child {
    display: none;
  }

  .corner {

    width: 22px;
    height: 22px;

  }

  .corner-tl {
    top: 20px;
    left: 20px;
  }

  .corner-tr {
    top: 20px;
    right: 20px;
  }

  .corner-bl {
    bottom: 20px;
    left: 20px;
  }

  .corner-br {
    bottom: 20px;
    right: 20px;
  }

  .orb-1 {

    width: 100px;
    height: 100px;

    top: 12%;
    left: -30px;

  }

  .orb-2 {

    width: 60px;
    height: 60px;

    right: 5%;
    bottom: 20%;

  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {

    animation-duration: .01ms !important;

    animation-iteration-count: 1 !important;

    transition-duration: .01ms !important;

  }

}

</style>

</head>


<body>


<main class="maintenance">


  <!-- BACKGROUND -->

  <div class="background"></div>

  <div class="light-sweep"></div>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>


  <!-- CORNER MARKS -->

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>


  <!-- CAMERA / MOBILE PHOTOGRAPHY VISUAL -->

  <div class="camera-system">

    <div class="phone-body">

      <div class="camera-island">

        <div class="lens lens-1"></div>

        <div class="lens lens-2"></div>

        <div class="lens lens-3"></div>

      </div>

    </div>

  </div>


  <!-- MAIN CONTENT -->

  <section class="content">


    <div class="camera-icon"></div>


    <div class="brand">

      EXPOSURE <span>NOTES</span>

    </div>


    <div class="eyebrow">

      Photography / Visual Collection

    </div>


    <h1 class="title">

      Under<br>

      <em>Maintenance.</em>

    </h1>


    <p class="description">

      We're currently working on something new.
      The visual collection is being refined,
      frames are being prepared, and the site
      will be back soon.

    </p>


    <div class="status">

      <span class="status-dot"></span>

      Currently updating the archive

    </div>


    <div class="motion-line"></div>


  </section>


  <!-- FOOTER -->

  <footer class="footer">

    <span>
      Mobile Photography / 2026
    </span>

    <span>
      Managed by <strong>Exposure Notes</strong>
    </span>

  </footer>


</main>


<script src="maintenance-config.js"></script>

<script>

  if (!MAINTENANCE_MODE) {

    window.location.href = "index.html";

  }

</script>
  
</body>

</html>
